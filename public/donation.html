<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=https://hcb.hackclub.com/donations/start/bonsai-exe" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BONSAI.exe Donation</title>
    <meta name="description" content="Support BONSAI.exe through the Hack Club donation page." />
    <style>
      :root {
        --obsidian: #0a0b0a;
        --obsidian-2: #111412;
        --obsidian-3: #181c18;
        --sage: #8aa88a;
        --sage-dim: #4d6f4f;
        --gold: #b9a06a;
        --ivory: #f0ede6;
        --ivory-dim: #a8a49e;
        --border: rgba(138,168,138,0.2);
        --border-dim: rgba(138,168,138,0.08);
        --ff-sans: 'Inter', 'SF Pro Display', system-ui, sans-serif;
        --ff-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--obsidian);
        color: var(--ivory);
        font-family: var(--ff-sans);
        line-height: 1.6;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(720px, calc(100vw - 32px));
        border: 1px solid var(--border-dim);
        background: rgba(255,255,255,0.01);
        padding: 40px 28px;
        text-align: center;
      }
      .eyebrow {
        font-family: var(--ff-mono);
        font-size: 10px;
        letter-spacing: 0.28em;
        color: var(--sage);
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      h1 {
        font-size: clamp(36px, 6vw, 72px);
        line-height: 0.94;
        letter-spacing: -0.04em;
        font-weight: 300;
        margin-bottom: 18px;
      }
      h1 strong { color: var(--sage); font-weight: 700; }
      p {
        color: var(--ivory-dim);
        font-size: 18px;
        max-width: 620px;
        margin: 0 auto 24px;
      }
      a {
        color: var(--gold);
        text-decoration: none;
        border: 1px solid var(--border);
        padding: 12px 20px;
        display: inline-block;
        font-family: var(--ff-mono);
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      a:hover { border-color: var(--sage); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">Support Us</div>
      <h1>Redirecting to our <strong>donation page</strong>…</h1>
      <p>If you are not automatically redirected, click below to continue to the Hack Club donation form for BONSAI.exe.</p>
      <a href="https://hcb.hackclub.com/donations/start/bonsai-exe">Continue to Donation Page</a>
    </div>
  </body>
</html>
